<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kainity</title>
<link rel="icon" href="kainity.png">
<style>
  :root{
    color-scheme:light dark;
    --bg:#e9e3d9;--bar:#f6f3ee;--in:#fff;--line:#d8d0c3;--text:#221f1b;--dim:#80796d;
    --me:#d4e5c7;--metx:#1c2817;--bubtx:#221f1b;--field:#fff;--ac:#3d6a51;--green:#4cae6a;--red:#d64541;
  }
  @media(prefers-color-scheme:dark){:root{
    --bg:#12110f;--bar:#1b1a17;--in:#26241f;--line:#2d2a25;--text:#ece8e0;--dim:#8d877b;
    --me:#2c4939;--metx:#e8f1e4;--bubtx:#ece8e0;--field:#26241f;--ac:#6ea987;
  }}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit}
  #app{width:100%;max-width:600px;height:100dvh;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden;border:0 solid var(--line);border-width:0 1px}

  /* header */
  header{display:flex;align-items:center;gap:4px;padding:8px 10px 8px 14px;background:var(--bar);border-bottom:1px solid var(--line);z-index:2}
  .av{position:relative;width:40px;height:40px;margin-right:8px;flex:none}
  .av img{width:100%;height:100%;border-radius:50%;object-fit:cover;background:var(--line);display:block}
  .on{position:absolute;right:0;bottom:0;width:10px;height:10px;border-radius:50%;background:var(--green);border:2px solid var(--bar)}
  .who{flex:1;min-width:0;display:flex;flex-direction:column}
  .who b{font-size:16px;font-weight:600;line-height:1.2}
  #sub{font-size:12.5px;color:var(--dim)}
  .ib{width:38px;height:38px;border-radius:50%;border:0;background:none;display:grid;place-items:center;cursor:pointer;flex:none}
  .ib:hover{background:var(--line)}
  .ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .ib.off{color:var(--dim)}
  .ib .x{display:none}.ib.off .x{display:block}
  #exitd{display:none;border:1px solid var(--line);background:var(--field);color:var(--text);font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:16px;cursor:pointer;margin-right:4px}
  #exitd:hover{border-color:var(--red);color:var(--red)}

  /* messages */
  #log{flex:1;overflow-y:auto;padding:12px 12px 6px;display:flex;flex-direction:column;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .day{align-self:center;font-size:12px;color:var(--dim);background:var(--bar);border:1px solid var(--line);padding:3px 11px;border-radius:8px;margin:4px 0 10px}
  .empty{margin:auto;text-align:center;color:var(--dim);font-size:13.5px}
  .empty img{width:72px;height:72px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 10px}
  .row{display:flex;margin-top:2px;animation:in .18s ease-out}
  .row.first{margin-top:9px}
  .row.u{justify-content:flex-end}
  .m{max-width:80%;padding:6px 9px 5px 10px;border-radius:10px;word-wrap:break-word;white-space:pre-wrap;box-shadow:0 1px 0 rgba(0,0,0,.09)}
  .b .m{background:var(--in);color:var(--bubtx)}
  .u .m{background:var(--me);color:var(--metx)}
  .b.first .m{border-top-left-radius:2px}
  .u.first .m{border-top-right-radius:2px}
  .ts{float:right;margin:7px 0 -3px 12px;font-size:10.5px;line-height:1;color:var(--dim);white-space:nowrap}
  .tk{font-weight:400}.tk.rd{color:#3b8fd1}
  @keyframes in{from{opacity:0;transform:translateY(5px)}}
  .typing .m{display:flex;gap:3px;padding:11px 12px}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--dim);animation:bl 1.1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes bl{0%,70%,100%{opacity:.35;transform:none}35%{opacity:1;transform:translateY(-3px)}}

  /* input */
  form{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--bar);border-top:1px solid var(--line)}
  input{flex:1;min-width:0;background:var(--field);border:1px solid var(--line);color:var(--text);padding:10px 14px;border-radius:20px;font:inherit;outline:0}
  input:focus{border-color:var(--ac)}
  #send{width:40px;height:40px;border-radius:50%;border:0;background:var(--ac);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
  #send svg{width:18px;height:18px;fill:#fff}
  #send:disabled{background:var(--line);cursor:default}#send:disabled svg{fill:var(--dim)}
  .note{text-align:center;font-size:10.5px;color:var(--dim);padding:0 0 calc(6px + env(safe-area-inset-bottom));background:var(--bar)}

  /* dating */
  #app.dating{background:var(--wall) center/cover;
    --bar:rgba(32,20,25,.86);--text:#f7eef1;--dim:#cdb8c0;--line:rgba(255,255,255,.16);--field:rgba(255,255,255,.14);
    --me:#f2b5c8;--metx:#3a1522;--ac:#d96b8c;--in:rgba(255,255,255,.92);--bubtx:#2b1a22}
  #app.dating #log{background:rgba(0,0,0,.14)}
  #app.dating #exitd{display:block;background:rgba(255,255,255,.12)}
  #app.dating input::placeholder{color:#cdb8c0}

  /* he's mad: red theme */
  #app.blood{--bg:#140605;--bar:#200908;--in:#2a0f0d;--line:#3b1612;--text:#f0dcd7;--dim:#a47d76;
    --me:#6b1713;--metx:#fbe8e4;--bubtx:#f0dcd7;--field:#2a0f0d;--green:#e0594f;--ac:#b3261e}
  #app.blood::before{content:"";position:absolute;inset:0;box-shadow:inset 0 0 110px rgba(110,0,0,.6);pointer-events:none;z-index:4}
  #app.blood #exitd{display:none}
  #app.mad{animation:shake .12s infinite}
  @keyframes shake{25%{transform:translate(-6px,4px) rotate(-.5deg)}50%{transform:translate(6px,-5px) rotate(.5deg)}75%{transform:translate(-4px,-5px)}}
  #app.mad::after{content:"";position:absolute;inset:0;background:#c00;opacity:0;pointer-events:none;z-index:30;animation:fl2 .22s infinite alternate}
  @keyframes fl2{to{opacity:.2}}
  #app.mad .m{animation:jit .18s infinite}
  @keyframes jit{33%{transform:translate(2px,-2px) skewX(3deg)}66%{transform:translate(-3px,1px) skewX(-4deg)}}
  #app.mad{background:#220403}

  /* minigame overlay (rhythm) */
  #calm{position:absolute;inset:0;z-index:40;background:#1a0605;opacity:0;pointer-events:none;transition:opacity .6s;touch-action:none}
  #calm.show{opacity:1;pointer-events:auto}
  #calm canvas{width:100%;height:100%;display:block}
  #cmsg{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:rgba(10,2,2,.85);color:#f0dcd7;padding:20px}
  #cmsg.show{display:flex}
  #cmsg b{font-size:24px}#cmsg small{color:#c9a29b;font-size:14px}
  #cmsg button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:11px 20px;font-weight:600;cursor:pointer}

  /* call */
  #call{position:absolute;inset:0;z-index:5;background:#1a1916;color:#f1ede6;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:64px 20px 56px;opacity:0;pointer-events:none;transition:opacity .2s}
  #app.dating #call{background:var(--wall) center/cover}
  #app.dating #call::before{content:"";position:absolute;inset:0;background:rgba(15,8,12,.6);z-index:-1}
  #call.show{opacity:1;pointer-events:auto}
  .cn{text-align:center}.cn b{font-size:24px;font-weight:600;display:block}
  #ctime{opacity:.7;font-size:14px;margin-top:4px}
  #cpic{width:150px;height:150px;border-radius:50%;object-fit:cover;background:#2c2a26}
  #cstat{opacity:.7;height:20px;font-size:14px}
  #hang{width:64px;height:64px;border-radius:50%;border:0;background:var(--red);display:grid;place-items:center;cursor:pointer}
  #hang svg{width:26px;height:26px;fill:#fff;transform:rotate(135deg)}

  /* clicker */
  #game{position:absolute;inset:0;z-index:8;background:var(--bg);display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .2s;user-select:none;-webkit-user-select:none}
  #game.show{opacity:1;pointer-events:auto}
  .gtop{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bar);border-bottom:1px solid var(--line)}
  .gtop b{flex:1;font-size:16px}
  .sb{background:var(--field);border:1px solid var(--line);border-radius:16px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
  .sb:hover{border-color:var(--ac)}
  #gscore{text-align:center;padding:12px 0 0}
  #gb{font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  #gscore small{color:var(--dim)}
  #gps{color:var(--dim);font-size:13px;margin-top:3px}
  #gmul{height:18px;font-size:12px;font-weight:600;color:#b9821a}
  #gstage{position:relative;height:200px;flex:none;display:grid;place-items:center;overflow:hidden}
  #gpic{width:140px;height:140px;object-fit:contain;cursor:pointer;touch-action:manipulation;-webkit-user-drag:none}
  #gpic.pop{animation:pop .12s ease-out}
  @keyframes pop{40%{transform:scale(.9) rotate(-2deg)}}
  #gcombo{position:absolute;top:6px;right:14px;font-weight:700;color:var(--ac);opacity:0;transition:opacity .15s}
  .fl{position:absolute;pointer-events:none;font-weight:700;font-size:18px;animation:fl .9s ease-out forwards;z-index:3}
  .fl.crit{color:#b9821a;font-size:24px}
  @keyframes fl{to{transform:translateY(-64px);opacity:0}}
  .pt{position:absolute;pointer-events:none;animation:pt .7s ease-out forwards}
  @keyframes pt{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
  #gold{position:absolute;width:58px;height:58px;border-radius:50%;border:2px solid #b8861a;background:#e3a92c;color:#3b2a00;font-size:10px;font-weight:800;cursor:pointer;z-index:5;display:none;box-shadow:0 3px 8px rgba(0,0,0,.3);animation:gf 1.3s ease-in-out infinite alternate}
  @keyframes gf{to{transform:translateY(-8px)}}
  #gbar{display:flex;gap:8px;align-items:center;padding:8px 14px;border-block:1px solid var(--line);background:var(--bar);font-size:12.5px;color:var(--dim)}
  #gbar span{flex:1}
  #gpres{background:var(--ac);color:#fff;border:0;border-radius:16px;padding:7px 13px;font-weight:600;font-size:12.5px;cursor:pointer}
  #gpres:disabled{background:var(--line);color:var(--dim);cursor:default}
  #gshop{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .it{display:flex;align-items:center;gap:12px;padding:9px 12px;background:var(--bar);border:1px solid var(--line);border-radius:10px;cursor:pointer;text-align:left}
  .it:hover{border-color:var(--ac)}.it:active{transform:scale(.985)}.it.no{opacity:.5}
  .it .ic{font-size:22px;width:30px;text-align:center}
  .it .tx{flex:1;min-width:0}.it .tx b{display:block;font-size:14px}.it .tx small{color:var(--dim);font-size:12px}
  .it .rt{text-align:right;font-size:12px;color:var(--dim)}.it .rt b{display:block;font-size:13.5px;color:var(--text)}
  #gtoast{position:absolute;left:50%;bottom:20px;transform:translate(-50%,20px);background:#2a2723;color:#fff;font-size:13px;padding:9px 15px;border-radius:8px;opacity:0;pointer-events:none;transition:.3s;z-index:9;white-space:nowrap}
  #gtoast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="av"><img id="hav" src="kainity.png" alt=""><i class="on"></i></div>
    <div class="who"><b>Kainity</b><span id="sub">online</span></div>
    <button id="exitd" title="Break up">Break up</button>
    <button class="ib" id="mmute" title="Music"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><path class="x" d="M3 3l18 18"/></svg></button>
    <button class="ib" id="mute" title="Voice replies"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/><path class="x" d="M3 3l18 18"/></svg></button>
    <button class="ib" id="callbtn" title="Voice call"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></button>
  </header>

  <div id="log"><div class="empty" id="empty"><img src="kainity.png" alt="">say something bruh</div></div>

  <form id="f">
    <input id="in" placeholder="Message" autocomplete="off" autofocus>
    <button id="send" disabled title="Send"><svg viewBox="0 0 24 24"><path d="M2 21 23 12 2 3v7l15 2-15 2z"/></svg></button>
  </form>
  <div class="note">AI character. Not the real person.</div>

  <div id="call">
    <div class="cn"><b>Kainity</b><div id="ctime">Calling...</div></div>
    <img id="cpic" src="kainity.png" alt="">
    <div id="cstat"></div>
    <button id="hang" title="End call"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></button>
  </div>

  <div id="game">
    <div class="gtop"><b>Kainity Clicker</b><button class="sb" id="gsfx">sfx: on</button><button class="sb" id="gx">back to chat</button></div>
    <div id="gscore"><div id="gb">0</div><small>beats</small><div id="gps"></div><div id="gmul"></div></div>
    <div id="gstage"><img id="gpic" src="kainity.png" alt="" draggable="false"><div id="gcombo"></div><button id="gold">SHOUT OUT</button></div>
    <div id="gbar"><span id="ginfo"></span><button id="gpres" disabled>Drop a hit</button></div>
    <div id="gshop"></div>
    <div id="gtoast"></div>
  </div>

  <div id="calm"><canvas id="cv"></canvas><div id="cmsg"></div></div>
</div>

<script>
const $ = (i) => document.getElementById(i);
const pick = (a) => a[(Math.random() * a.length) | 0];
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const log = $("log"), input = $("in"), send = $("send"), sub = $("sub"), hav = $("hav"), cpic = $("cpic"), app = $("app");
const hist = [];
let voice = true, ctx, analyser, data, level = 0, fishDead = false;
let inCall = false, busy = false, rec = null, timer = null, t0 = 0;
let dating = false, blood = false, anger = 0, ruined = false, musicMuted = false, lastSide = "", unread = 0;
const audio = new Audio(), music = new Audio("dating.mp3"), madSong = new Audio("mad.mp3");
music.loop = madSong.loop = true;
music.volume = 0.3; madSong.volume = 0.7;
const synth = window.speechSynthesis;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

const WALL = "https://i.pinimg.com/474x/7e/35/9f/7e359ff9cece12b0feae48230aa5499c.jpg?nii=t";
document.documentElement.style.setProperty("--wall", `url("${WALL}")`);
new Image().src = WALL;

/* ---------- music mute ---------- */
function applyMute() {
  [music, madSong].forEach((a) => (a.muted = musicMuted));
  $("mmute").classList.toggle("off", musicMuted);
}
$("mmute").onclick = () => { musicMuted = !musicMuted; applyMute(); };
applyMute();

/* ---------- modes ---------- */
const DATE_RE = /\bdat(e|es|ed|ing)\b/i;
const EXIT_RE = /\b(stop|end|quit|exit|leave)\s+(the\s+)?dating\b/i;
const GAME_RE = /\b(play|playing)\b.*\b(game|games|clicker|minigame)\b|\b(game|games|minigame)\b.*\bplay\b|\bclicker\b/i;
const GAME_LINES = ["say less bro, opening the clicker", "aight bet, click me till youre rich", "lets cook bruh, click my face", "bet, go make some beats"];
const INSULT_RE = /\b(stupid|dumb|idiot|moron|trash|garbage|ugly|loser|clown|cringe|worthless|pathetic|shut up|sucks?|mid|noob|hate you|fuck you|bitch|you('re| are) (bad|a joke|nothing|annoying)|(zeak|prettifun|slayr|jaydes|nine vicious) (is|are) better)\b/i;

function setDating(on) {
  if (dating === on || ruined || blood) return;
  dating = on;
  app.classList.toggle("dating", on);
  if (on) { music.currentTime = 0; music.play().catch(() => {}); } else music.pause();
  hist.splice(0, Math.max(0, hist.length - 2));
  setState("");
}
let bleo = false;
function modeNow() { return bleo ? "bleoodity" : dating ? "dating" : "normal"; }
function setBleo(on) {
  if (bleo === on) return;
  bleo = on;
  const pic = on ? "bleoodity.png" : "kainity.png", name = on ? "Bleood" : "Kainity";
  document.querySelectorAll('img[src$="kainity.png"],img[src$="bleoodity.png"]').forEach((i) => (i.src = pic));
  document.querySelectorAll(".who b,.cn b").forEach((b) => (b.textContent = name));
  document.title = name;
  hist.splice(0, Math.max(0, hist.length - 2));
}
function checkMode(t) {
  if (/\b(stop|end|quit|exit|leave)\s+bleoodity\b|\bback to kainity\b/i.test(t)) setBleo(false);
  else if (/bleoodity/i.test(t)) setBleo(true);
  if (blood) return;
  if (EXIT_RE.test(t)) setDating(false);
  else if (DATE_RE.test(t)) setDating(true);
}
$("exitd").onclick = () => setDating(false);

/* ---------- ui ---------- */
function moodLabel() {
  if (anger >= 2) return "getting mad...";
  if (anger === 1) return "annoyed";
  return dating ? "dating sim mode" : "online";
}
function setState(s, l) {
  sub.textContent = l || moodLabel();
  $("cstat").textContent = inCall ? l || "" : "";
}

const clock = () => new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });

function add(text, cls) {
  const e = $("empty");
  if (e) {
    e.remove();
    const d = document.createElement("div");
    d.className = "day"; d.textContent = "Today";
    log.appendChild(d);
  }
  const row = document.createElement("div");
  row.className = "row " + cls + (lastSide !== cls ? " first" : "");
  lastSide = cls;
  const m = document.createElement("div"); m.className = "m";
  const s = document.createElement("span"); s.textContent = text;
  const t = document.createElement("small"); t.className = "ts"; t.textContent = clock();
  if (cls === "u") {
    const k = document.createElement("b"); k.className = "tk"; k.textContent = "✓";
    t.append(" ", k);
  }
  m.append(s, t); row.append(m); log.append(row);
  log.scrollTop = log.scrollHeight;
  return s;
}
function markRead() { log.querySelectorAll(".tk:not(.rd)").forEach((k) => { k.textContent = "✓✓"; k.classList.add("rd"); }); }

let typingRow = null;
function showTyping() {
  hideTyping();
  const e = $("empty"); if (e) e.remove();
  typingRow = document.createElement("div");
  typingRow.className = "row b typing" + (lastSide !== "b" ? " first" : "");
  typingRow.innerHTML = '<div class="m"><i></i><i></i><i></i></div>';
  log.append(typingRow);
  log.scrollTop = log.scrollHeight;
  markRead();
}
function hideTyping() { if (typingRow) { typingRow.remove(); typingRow = null; } }

function incoming(t) {
  add(t, "b");
  if (document.hidden) { unread++; document.title = `(${unread}) Kainity`; }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) { unread = 0; document.title = "Kainity"; } });

/* ---------- audio ---------- */
function initAudio() {
  if (ctx) return ctx.resume();
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  const s = ctx.createMediaElementSource(audio);
  analyser = ctx.createAnalyser();
  analyser.fftSize = 256;
  data = new Uint8Array(256);
  s.connect(analyser);
  analyser.connect(ctx.destination);
}
(function loop() {
  let t = 0;
  if (analyser && !audio.paused) {
    analyser.getByteTimeDomainData(data);
    let s = 0;
    for (const v of data) s += ((v - 128) / 128) ** 2;
    t = Math.min(1, Math.sqrt(s / data.length) * 5);
  } else if (synth && synth.speaking) t = 0.3 + 0.4 * Math.abs(Math.sin(Date.now() / 90)) * Math.random() * 1.4;
  level += (t - level) * 0.35;
  hav.style.transform = `scale(${1 + level * 0.08})`;
  cpic.style.boxShadow = `0 0 0 ${level * 16}px rgba(255,255,255,.1)`;
  requestAnimationFrame(loop);
})();

function stopVoice() { audio.pause(); if (synth) synth.cancel(); }
$("mute").onclick = () => {
  voice = !voice;
  $("mute").classList.toggle("off", !voice);
  if (!voice) stopVoice();
};

function browserSpeak(t, done) {
  if (!synth) return done();
  synth.cancel();
  const u = new SpeechSynthesisUtterance(t), vs = synth.getVoices().filter((v) => v.lang.startsWith("en"));
  u.voice = vs.find((v) => /male|david|mark|daniel|guy|alex/i.test(v.name) && !/female/i.test(v.name)) || vs[0] || null;
  u.pitch = 0.8; u.rate = 1.05;
  u.onend = u.onerror = done;
  synth.speak(u);
}
function speak(text) {
  return new Promise(async (done) => {
    if (!voice) return done();
    const c = text.replace(/\*[^*]*\*/g, "").replace(/\[[^\]]*\]/g, "").replace(/^\/.*$/gm, "").trim();
    if (!c) return done();
    if (!fishDead) {
      try {
        const r = await fetch("/api/tts", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: c, voice: bleo ? "bleoodity" : "" }) });
        if (r.ok) {
          audio.src = URL.createObjectURL(await r.blob());
          audio.onended = audio.onerror = done;
          await audio.play();
          return;
        }
        fishDead = true;
      } catch { fishDead = true; }
    }
    browserSpeak(c, done);
  });
}
if (synth) synth.getVoices();

async function ask(text, mode) {
  hist.push({ role: "user", text });
  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: hist, mode, anger: Math.min(anger, 2) }),
    });
    const d = await r.json();
    if (!d.reply) throw 0;
    hist.push({ role: "model", text: d.reply });
    return d.reply;
  } catch { hist.pop(); return null; }
}

/* one turn of conversation (breakup.js replaces this with the full anger system) */
async function turn(text) {
  checkMode(text);
  if (GAME_RE.test(text)) {
    if (inCall) endCall();
    const line = pick(GAME_LINES);
    incoming(line);
    hist.push({ role: "user", text }, { role: "model", text: line });
    setState(""); busy = false;
    speak(line);
    setTimeout(openGame, 700);
    return;
  }
  setState("thinking", "typing…");
  showTyping();
  const reply = await ask(text, modeNow());
  hideTyping();
  if (reply) {
    incoming(reply);
    if (inCall) { setState("speaking", "speaking…"); await speak(reply); } else speak(reply);
  } else incoming("connection cooked bruh, try again");
  setState("");
  busy = false;
}

/* ---------- typing ---------- */
input.oninput = () => (send.disabled = busy || !input.value.trim());
$("f").onsubmit = async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || busy || ruined) return;
  input.value = "";
  send.disabled = true;
  busy = true;
  initAudio();
  stopVoice();
  add(text, "u");
  await turn(text);
  if (!ruined) { send.disabled = !input.value.trim(); input.focus(); }
};

/* ---------- calling ---------- */
function listen() {
  if (!inCall || busy || ruined) return;
  rec = new SR();
  rec.lang = "en-US"; rec.interimResults = true; rec.continuous = false;
  let bubble = null, fin = "";
  rec.onstart = () => setState("listening", "listening…");
  rec.onresult = (e) => {
    let t = "";
    for (const r of e.results) t += r[0].transcript;
    fin = e.results[e.results.length - 1].isFinal ? t : "";
    if (!bubble) bubble = add(t, "u");
    bubble.textContent = t;
    log.scrollTop = log.scrollHeight;
  };
  rec.onerror = (e) => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") { incoming("mic blocked bruh, allow it in your browser"); endCall(); }
  };
  rec.onend = async () => {
    if (!inCall) return;
    const text = fin.trim();
    if (!text) {
      if (bubble) { bubble.closest(".row").remove(); lastSide = ""; }
      return setTimeout(listen, 250);
    }
    busy = true;
    await turn(text);
    setTimeout(listen, 250);
  };
  try { rec.start(); } catch {}
}
function startCall() {
  if (ruined) return;
  if (!SR) return incoming("calling needs Chrome or Edge bruh");
  initAudio(); stopVoice();
  voice = true; $("mute").classList.remove("off");
  inCall = true; busy = false;
  $("call").classList.add("show");
  t0 = Date.now();
  $("ctime").textContent = "00:00";
  timer = setInterval(() => {
    const s = Math.floor((Date.now() - t0) / 1000);
    $("ctime").textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }, 500);
  listen();
}
function endCall() {
  inCall = false; busy = false;
  clearInterval(timer);
  hideTyping();
  if (rec) { try { rec.abort(); } catch {} }
  stopVoice();
  $("call").classList.remove("show");
  setState("");
}
$("callbtn").onclick = startCall;
$("hang").onclick = endCall;

/* =====================================================
   KAINITY CLICKER
   ===================================================== */
const SAVE_KEY = "kainity_clicker_v1";
const ITEMS = [
  ["mic", "🎤", "Better Mic", "+1 beat per click", "click", 1, 25],
  ["fl", "🎹", "FL Studio", "+5 beats per click", "click", 5, 250],
  ["mon", "🔊", "Zenology", "+25 beats per click", "click", 25, 3000],
  ["plug", "🎛️", "Serum", "+150 beats per click", "click", 150, 40000],
  ["luke", "🧒", "Lil Luke", "protege makes 1/sec", "auto", 1, 40],
  ["squad", "🎮", "Che", "+6 per sec", "auto", 6, 200],
  ["tele", "🙂", "Verity", "+30 per sec", "auto", 30, 1200],
  ["rice", "🩸", "Osamason", "+160 per sec", "auto", 160, 8000],
  ["yt", "▶️", "2Slimey", "+900 per sec", "auto", 900, 50000],
  ["live", "📡", "Bleood", "+5,000 per sec", "auto", 5000, 300000],
  ["bleood", "👯", "Boolymon", "+30,000 per sec", "auto", 30000, 2000000],
].map(([id, ic, name, d, type, v, base]) => ({ id, ic, name, d, type, v, base }));
const ACHS = [
  ["c1", "First click", (s) => s.clicks >= 1],
  ["c100", "100 clicks", (s) => s.clicks >= 100],
  ["c1k", "1,000 clicks. we cooking up chat", (s) => s.clicks >= 1e3],
  ["b1k", "1K beats", (s) => s.total >= 1e3],
  ["b100k", "100K beats", (s) => s.total >= 1e5],
  ["b1m", "1M beats. thats crazy", (s) => s.total >= 1e6],
  ["b1b", "1B beats. jesus christ", (s) => s.total >= 1e9],
  ["own", "Own 10 of something", (s) => ITEMS.some((i) => (s.owned[i.id] || 0) >= 10)],
  ["gold", "Shoutout Boolymon!", (s) => s.gold >= 1],
  ["gold5", "5 golden shoutouts", (s) => s.gold >= 5],
  ["hit", "Dropped a hit", (s) => s.hits >= 1],
];
const fresh = () => ({ beats: 0, total: 0, clicks: 0, owned: {}, hits: 0, gold: 0, ach: {}, sfx: true, t: 0 });
let S = fresh();
try { S = Object.assign(fresh(), JSON.parse(localStorage.getItem(SAVE_KEY) || "{}")); } catch {}

const gE = { game: $("game"), b: $("gb"), ps: $("gps"), mul: $("gmul"), pic: $("gpic"), stage: $("gstage"), combo: $("gcombo"), shop: $("gshop"), gold: $("gold"), info: $("ginfo"), pres: $("gpres"), toast: $("gtoast") };
let gOpen = false, gTick = null, gSave = null, gGoldT = null, gGoldHide = null, frenzyEnd = 0, combo = 0, lastClick = 0, shopBuilt = false;

function fmt(n) {
  if (n < 1000) return n < 10 && n % 1 ? n.toFixed(1) : Math.floor(n).toString();
  const u = ["K", "M", "B", "T", "Qa"];
  let i = -1;
  while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
  return n.toFixed(n < 10 ? 2 : n < 100 ? 1 : 0) + u[i];
}
const owned = (it) => S.owned[it.id] || 0;
const costOf = (it) => Math.ceil(it.base * Math.pow(1.15, owned(it)));
const prest = () => 1 + S.hits * 0.1;
const frenzy = () => (Date.now() < frenzyEnd ? 7 : 1);
const perClick = () => (1 + ITEMS.filter((i) => i.type === "click").reduce((a, i) => a + owned(i) * i.v, 0)) * prest() * frenzy();
const perSec = () => ITEMS.filter((i) => i.type === "auto").reduce((a, i) => a + owned(i) * i.v, 0) * prest() * frenzy();

let gc = null;
function gA() {
  if (!gc) gc = new (window.AudioContext || window.webkitAudioContext)();
  if (gc.state === "suspended") gc.resume();
  return gc;
}
function tone(f, d = 0.1, type = "square", vol = 0.08, when = 0, slide = 0) {
  if (!S.sfx) return;
  try {
    const c = gA(), t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + d + 0.02);
  } catch {}
}
const sfx = {
  click: (c) => { tone(180 + c * 40, 0.09, "triangle", 0.14, 0, 160); tone(90, 0.07, "sine", 0.12); },
  crit: () => { tone(880, 0.12, "square", 0.08); tone(1320, 0.18, "square", 0.08, 0.06); tone(1760, 0.25, "triangle", 0.08, 0.12); },
  buy: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.12, "square", 0.07, i * 0.06)),
  no: () => tone(130, 0.18, "sawtooth", 0.07, 0, -50),
  gold: () => [1047, 1319, 1568, 2093, 1568, 2093, 2637].forEach((f, i) => tone(f, 0.15, "triangle", 0.09, i * 0.07)),
  ach: () => [392, 523, 659, 784].forEach((f, i) => tone(f, 0.22, "square", 0.07, i * 0.1)),
  hit: () => { for (let i = 0; i < 10; i++) tone(200 + i * 120, 0.14, "sawtooth", 0.06, i * 0.05); },
  spawn: () => { tone(1568, 0.1, "sine", 0.08); tone(2093, 0.15, "sine", 0.08, 0.1); },
};

function toast(t) {
  gE.toast.textContent = t;
  gE.toast.classList.add("show");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => gE.toast.classList.remove("show"), 2600);
}

function buildShop() {
  gE.shop.innerHTML = "";
  ITEMS.forEach((it) => {
    const b = document.createElement("button");
    b.className = "it"; b.dataset.id = it.id;
    b.innerHTML = `<span class="ic">${it.ic}</span><span class="tx"><b>${it.name}</b><small>${it.d}</small></span><span class="rt"><b class="co"></b><i class="ow"></i></span>`;
    b.onclick = () => buy(it);
    gE.shop.appendChild(b);
  });
  shopBuilt = true;
}
function buy(it) {
  const c = costOf(it);
  if (S.beats < c) return sfx.no();
  S.beats -= c;
  S.owned[it.id] = owned(it) + 1;
  sfx.buy();
  render();
}
function render() {
  gE.b.textContent = fmt(S.beats);
  gE.ps.textContent = `${fmt(perSec())} per sec  |  ${fmt(perClick())} per click`;
  const fr = frenzy() > 1;
  gE.mul.textContent = fr ? `SHOUTOUT FRENZY x7 (${Math.ceil((frenzyEnd - Date.now()) / 1000)}s)` : S.hits ? `hit bonus x${prest().toFixed(1)}` : "";
  gE.shop.querySelectorAll(".it").forEach((b) => {
    const it = ITEMS.find((i) => i.id === b.dataset.id), c = costOf(it);
    b.querySelector(".co").textContent = fmt(c);
    b.querySelector(".ow").textContent = "owned " + owned(it);
    b.classList.toggle("no", S.beats < c);
  });
  const gain = Math.floor(Math.sqrt(S.total / 1e6)) - S.hits;
  gE.pres.disabled = gain < 1;
  gE.pres.textContent = gain > 0 ? `Drop a hit (+${gain})` : "Drop a hit";
  gE.info.textContent = gain > 0 ? "reset for a permanent +10% per hit" : `drop a hit at 1M total beats (${fmt(S.total)} so far)`;
}
function checkAch() {
  ACHS.forEach(([id, n, ck]) => {
    if (!S.ach[id] && ck(S)) { S.ach[id] = 1; toast("Achievement: " + n); sfx.ach(); }
  });
}

function floatText(txt, x, y, crit) {
  const f = document.createElement("div");
  f.className = "fl" + (crit ? " crit" : "");
  f.textContent = txt;
  f.style.left = x - 20 + "px"; f.style.top = y - 20 + "px";
  gE.stage.appendChild(f);
  setTimeout(() => f.remove(), 900);
}
function burst(x, y, n) {
  for (let i = 0; i < n; i++) {
    const p = document.createElement("div");
    p.className = "pt";
    p.textContent = pick(["♪", "♫", "🎵", "★"]);
    p.style.left = x + "px"; p.style.top = y + "px";
    p.style.setProperty("--dx", (Math.random() - 0.5) * 140 + "px");
    p.style.setProperty("--dy", -30 - Math.random() * 90 + "px");
    p.style.setProperty("--r", (Math.random() - 0.5) * 360 + "deg");
    gE.stage.appendChild(p);
    setTimeout(() => p.remove(), 700);
  }
}
function clickKainity(e) {
  const now = Date.now();
  combo = now - lastClick < 450 ? Math.min(combo + 1, 12) : 0;
  lastClick = now;
  const crit = Math.random() < 0.08;
  const gain = perClick() * (1 + combo * 0.05) * (crit ? 5 : 1);
  S.beats += gain; S.total += gain; S.clicks++;
  const r = gE.stage.getBoundingClientRect();
  const x = e && e.clientX ? e.clientX - r.left : r.width / 2, y = e && e.clientY ? e.clientY - r.top : r.height / 2;
  floatText("+" + fmt(gain), x, y, crit);
  burst(x, y, crit ? 8 : 2);
  gE.pic.classList.remove("pop"); void gE.pic.offsetWidth; gE.pic.classList.add("pop");
  gE.combo.textContent = combo >= 3 ? `combo x${combo}` : "";
  gE.combo.style.opacity = combo >= 3 ? 1 : 0;
  crit ? sfx.crit() : sfx.click(combo);
  render();
}
gE.pic.addEventListener("pointerdown", (e) => { e.preventDefault(); clickKainity(e); });
setInterval(() => { if (Date.now() - lastClick > 800) gE.combo.style.opacity = 0; }, 400);

function scheduleGold() { clearTimeout(gGoldT); gGoldT = setTimeout(spawnGold, 25000 + Math.random() * 30000); }
function spawnGold() {
  if (!gOpen) return;
  const r = gE.stage.getBoundingClientRect();
  gE.gold.style.left = 10 + Math.random() * (r.width - 90) + "px";
  gE.gold.style.top = 10 + Math.random() * (r.height - 90) + "px";
  gE.gold.style.display = "block";
  sfx.spawn();
  clearTimeout(gGoldHide);
  gGoldHide = setTimeout(() => { gE.gold.style.display = "none"; scheduleGold(); }, 9000);
}
gE.gold.onclick = (e) => {
  e.stopPropagation();
  gE.gold.style.display = "none";
  clearTimeout(gGoldHide);
  frenzyEnd = Date.now() + 15000;
  const bonus = Math.max(100, perSec() * 30);
  S.beats += bonus; S.total += bonus; S.gold++;
  toast(`Shoutout Boolymon! +${fmt(bonus)} and x7 for 15s`);
  sfx.gold(); scheduleGold(); render();
};

gE.pres.onclick = () => {
  const gain = Math.floor(Math.sqrt(S.total / 1e6)) - S.hits;
  if (gain < 1) return;
  if (!confirm(`Drop a hit? You reset beats and upgrades but get +${gain} hit(s), each worth +10% to everything forever.`)) return;
  S = Object.assign(fresh(), { hits: S.hits + gain, gold: S.gold, ach: S.ach, sfx: S.sfx, clicks: S.clicks });
  sfx.hit();
  toast("You dropped a hit! bonus is now x" + prest().toFixed(1));
  render();
};

function saveGame() { S.t = Date.now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch {} }

function openGame() {
  if (ruined || gOpen) return;
  gOpen = true;
  if (!shopBuilt) buildShop();
  $("gsfx").textContent = "sfx: " + (S.sfx ? "on" : "off");
  gE.game.classList.add("show");
  try { gA(); } catch {}
  if (S.t) {                                   // beats made while you were away (25%, max 2h)
    const away = Math.min((Date.now() - S.t) / 1000, 7200), g = perSec() * away * 0.25;
    if (g >= 1) { S.beats += g; S.total += g; toast(`While you were away: +${fmt(g)} beats`); }
  }
  render();
  let last = performance.now();
  gTick = setInterval(() => {
    const n = performance.now(), a = (perSec() * (n - last)) / 1000;
    last = n;
    S.beats += a; S.total += a;
    checkAch(); render();
  }, 100);
  gSave = setInterval(saveGame, 5000);
  scheduleGold();
}
function closeGame() {
  if (!gOpen) return;
  gOpen = false;
  clearInterval(gTick); clearInterval(gSave);
  clearTimeout(gGoldT); clearTimeout(gGoldHide);
  gE.gold.style.display = "none";
  gE.game.classList.remove("show");
  saveGame();
  if (!ruined) setTimeout(() => input.focus(), 300);
}
$("gx").onclick = closeGame;
$("gsfx").onclick = () => {
  S.sfx = !S.sfx;
  $("gsfx").textContent = "sfx: " + (S.sfx ? "on" : "off");
  if (S.sfx) sfx.buy();
};
addEventListener("keydown", (e) => {
  if (!gOpen) return;
  if (e.key === "Escape") closeGame();
  if (e.code === "Space") { e.preventDefault(); if (!e.repeat) clickKainity(); }
});
addEventListener("beforeunload", saveGame);
</script>
